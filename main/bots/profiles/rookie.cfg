// rookie.cfg - Inexperienced soldier
// Slow to acquire targets, shaky aim, and poor trigger discipline. Provides
// satisfying easy kills that keep less skilled players engaged.

name                    rookie
weight                  0.6

// Aim / rotation - slow to track, shaky hand
turnSpeed               5
aimNoise                0.6
aimOvershoot            0.2
aimSettleSpeed          5.0
aimLerpSpeed            6.0
aimSpreadMult           1.8

// Combat reaction - slow to notice and respond to threats
reactionMinDelay        0.5
reactionRandomDelay     2.0

// Fire control - erratic bursts, poor trigger control
burstMinTime            0.1
burstRandomDelay        0.6
continuousFireMinTime   0.3
continuousFireRandomTime 1.2

// Movement - rarely takes cover, stands in the open
crouchChance            10

// Perception - rookies have poorer awareness
visionDistanceMult      0.8

// Weapon preference
preferredWeapon         rifle
