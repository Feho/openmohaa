// gunner.cfg - Machine gun specialist
// Lays down sustained MG fire to suppress enemies and control areas.
// Deliberate rather than precise — puts rounds on target, not through it.

name                    gunner
weight                  1.0

// Aim / rotation - steady tracking, doesn't need to snap
turnSpeed               7
aimNoise                0.35
aimOvershoot            0.15
aimSettleSpeed          7.0
aimLerpSpeed            8.0
aimSpreadMult           1.4

// Combat reaction - average, gunner holds position rather than reacting fast
reactionMinDelay        0.2
reactionRandomDelay     1.2

// Fire control - sustained fire with minimal pauses
burstMinTime            0.5
burstRandomDelay        0.3
continuousFireMinTime   3.0
continuousFireRandomTime 1.5

// Movement - crouches to stabilize the gun
crouchChance            20

// Weapon preference
preferredWeapon         mg
