// suppressor.cfg - Area denial / suppression specialist
// Lays down continuous fire to force enemies into cover. Inaccurate but
// psychologically effective. Rarely stops to reload or reposition.

name                    suppressor
weight                  0.7

// Aim / rotation - average tracking, doesn't need precision
turnSpeed               7
aimNoise                0.5
aimOvershoot            0.15
aimSettleSpeed          7.0
aimLerpSpeed            8.0
aimSpreadMult           1.8

// Combat reaction - average, suppression doesn't require fast acquisition
reactionMinDelay        0.2
reactionRandomDelay     1.2

// Fire control - sustained fire with minimal pauses
burstMinTime            0.5
burstRandomDelay        0.3
continuousFireMinTime   3.0
continuousFireRandomTime 1.5

// Movement - occasional crouch to stabilize the gun
crouchChance            20

// Weapon preference
preferredWeapon         mg
