// sniper.cfg - Long-range, patient marksman
// Slow to react but very accurate. Prefers to crouch and take careful shots.

name                    sniper
weight                  0.5

// Aim / rotation - slow turn, very steady hand
turnSpeed               5
aimNoise                0.15
aimOvershoot            0.05
aimSettleSpeed          5.0
aimLerpSpeed            6.0
aimSpreadMult           0.5

// Combat reaction - patient, deliberate
reactionMinDelay        0.4
reactionRandomDelay     1.2

// Fire control - slow, controlled bursts
burstMinTime            0.3
burstRandomDelay        0.8
continuousFireMinTime   0.8
continuousFireRandomTime 2.5

// Movement - often crouches for accuracy
crouchChance            60

// Perception - snipers need good vision to pick targets
visionDistanceMult      1.2

// Weapon preference
preferredWeapon         sniper
