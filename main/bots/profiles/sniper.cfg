// Bot profile: sniper
// Long-range, patient, accurate. Low aggression, narrow FOV focus.

name                    sniper

// Combat reaction - slower initial reaction, but precise
reactionMinDelay        0.4
reactionRandomDelay     0.8
aimSpreadMult           0.6
aimSettleSpeed          12.0
aimOvershoot            0.05
aimNoise                0.15
aimLerpSpeed            6.0

// Engagement preferences - prefers long range
preferredRangeMin       400
preferredRangeMax       1500
riskTolerance           0.2
aggression              0.15

// Fire control - deliberate, controlled bursts
burstMinTime            0.05
burstRandomDelay        0.8
continuousFireMinTime   0.3
continuousFireRandomTime 0.5

// Movement - slow, deliberate, stays in position
turnSpeed               12
roamRadius              1024
walkChance              0.4
pauseChance             0.005
crouchChance            70

// Perception - narrow focus, sharp
hearingRange            1.0
visionFovDegrees        120

// Weapon preference
preferredWeapon         sniper

weight                  1.0
