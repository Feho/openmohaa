// infantryman.cfg - Balanced general-purpose soldier
// The standard grunt. Decent aim, moderate reaction time, uses whatever
// weapon is available. Forms the backbone of any bot roster.

name                    infantryman
weight                  1.0

// Aim / rotation
turnSpeed               7
aimNoise                0.35
aimOvershoot            0.12
aimSettleSpeed          8.0
aimLerpSpeed            10.0
aimSpreadMult           1.0

// Combat reaction
reactionMinDelay        0.2
reactionRandomDelay     1.4

// Fire control
burstMinTime            0.1
burstRandomDelay        0.5
continuousFireMinTime   0.5
continuousFireRandomTime 1.5

// Movement
crouchChance            30

// Weapon preference - no preference, takes what the server allows
preferredWeapon         auto
