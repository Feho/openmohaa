// rusher.cfg - Aggressive close-range fighter
// Fast reactions, sprays a lot, rarely crouches. Dangerous up close.

name                    rusher
weight                  0.8

// Aim / rotation - fast snap, less precise
turnSpeed               9
aimNoise                0.5
aimOvershoot            0.2
aimSettleSpeed          12.0
aimLerpSpeed            14.0
aimSpreadMult           1.5

// Combat reaction - very fast
reactionMinDelay        0.1
reactionRandomDelay     0.6

// Fire control - aggressive sustained fire
burstMinTime            0.05
burstRandomDelay        0.2
continuousFireMinTime   0.2
continuousFireRandomTime 0.8

// Movement - rarely stops to crouch
crouchChance            15

// Perception
visionDistanceMult      1.0

// Weapon preference
preferredWeapon         smg
