// veteran.cfg - Battle-hardened soldier
// Tight aim, fast reactions, controlled fire. Noticeably more dangerous
// than the average bot. Kept rare so encounters feel meaningful.

name                    veteran
weight                  0.3

// Aim / rotation - fast acquisition, minimal overshoot, snaps back quickly
turnSpeed               9
aimNoise                0.1
aimOvershoot            0.03
aimSettleSpeed          12.0
aimLerpSpeed            12.0
aimSpreadMult           0.7

// Combat reaction - very fast threat response
reactionMinDelay        0.1
reactionRandomDelay     0.4

// Fire control - controlled, efficient bursts
burstMinTime            0.2
burstRandomDelay        0.4
continuousFireMinTime   0.6
continuousFireRandomTime 1.0

// Movement - disciplined use of cover
crouchChance            50

// Perception - veterans are highly aware
visionDistanceMult      1.1

// Weapon preference
preferredWeapon         rifle
