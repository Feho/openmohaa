# main_bot.yaml
# Main bot behavior tree - integrates all behaviors
# Added in OPM - Phase 3 Task 3.2 (Investigation Behavior Integration)
# Composes combat, investigation, and patrol into prioritized decision tree

tree:
  name: "Main Bot Behavior"
  description: "Complete bot AI: combat → investigation → patrol priority"
  
  metadata:
    version: "1.0"
    author: "OpenMoHAA"
    phase: "3.2"
    requires:
      - "Phase 2A: PerceptionSystem with MemorySystem"
      - "Phase 2B: Behavior Tree Framework"
      - "Phase 3.1: Combat System"
      - "Phase 3.2: Investigation System"

  root:
    type: selector
    name: "Main Bot Selector"
    description: "Priority-based decision making"
    children:
      # ===================================================================
      # PRIORITY 1: Active Combat (highest priority)
      # When enemy is VISIBLE, engage immediately
      # ===================================================================
      - type: sequence
        name: "Active Combat"
        description: "Engage visible enemies"
        children:
          # Check if we have a visible enemy
          - type: condition
            check: "HasValidTarget"
          
          - type: condition
            check: "TargetVisible"
          
          # Execute complete combat tree (from combat.yaml logic)
          # This includes: retreat, weapon switch, reload, grenades, engagement
          - type: selector
            name: "Combat Actions"
            children:
              # Emergency retreat (health critical)
              - type: sequence
                name: "Emergency Tactical Retreat"
                children:
                  - type: condition
                    check: "ShouldRetreat"
                  - type: selector
                    name: "Find Safety"
                    children:
                      - type: sequence
                        name: "Retreat To Cover"
                        children:
                          - type: action
                            action: "FindCover"
                          - type: action
                            action: "MoveToCover"
                          - type: action
                            action: "TacticalRetreat"
                      - type: action
                        action: "TacticalRetreat"
                  - type: sequence
                    name: "Covering Fire While Retreating"
                    children:
                      - type: condition
                        check: "HasValidTarget"
                      - type: action
                        action: "SuppressFire"
              
              # Weapon management
              - type: sequence
                name: "Weapon Switch"
                children:
                  - type: selector
                    name: "Switch Reason"
                    children:
                      - type: sequence
                        name: "Switch Empty Weapon"
                        children:
                          - type: condition
                            check: "CurrentWeaponEmpty"
                          - type: condition
                            check: "WeaponSwitchReady"
                          - type: action
                            action: "SelectBestWeapon"
                          - type: action
                            action: "SwitchWeapon"
                      - type: sequence
                        name: "Switch To Better Weapon"
                        children:
                          - type: condition
                            check: "BetterWeaponAvailable"
                          - type: condition
                            check: "WeaponSwitchReady"
                          - type: action
                            action: "SelectBestWeapon"
                          - type: action
                            action: "SwitchWeapon"
              
              # Safe reload
              - type: sequence
                name: "Safe Reload Opportunity"
                children:
                  - type: condition
                    check: "AmmoLow"
                  - type: condition
                    check: "SafeToReload"
                  - type: action
                    action: "SafeReload"
              
              # Grenade throw
              - type: sequence
                name: "Throw Grenade At Cluster"
                children:
                  - type: condition
                    check: "HasGrenades"
                  - type: condition
                    check: "ShouldThrowGrenade"
                  - type: action
                    action: "CalculateGrenadeTarget"
                  - type: action
                    action: "ThrowGrenade"
              
              # Main engagement
              - type: sequence
                name: "Engage Enemy"
                children:
                  - type: condition
                    check: "HasValidTarget"
                  - type: condition
                    check: "TargetVisible"
                  - type: parallel
                    policy: "RequireAll"
                    name: "Combat Actions"
                    children:
                      - type: selector
                        name: "Manage Combat Distance"
                        children:
                          - type: sequence
                            name: "Retreat From Close Enemy"
                            children:
                              - type: condition
                                check: "EnemyTooClose"
                              - type: action
                                action: "RetreatFromEnemy"
                          - type: sequence
                            name: "Approach Distant Enemy"
                            children:
                              - type: condition
                                check: "EnemyTooFar"
                              - type: action
                                action: "ApproachEnemy"
                          - type: sequence
                            name: "Maintain Optimal Range"
                            children:
                              - type: condition
                                check: "InOptimalRange"
                              - type: action
                                action: "MaintainDistance"
                      - type: action
                        action: "AimAtTarget"
                        name: "Aim At Enemy"
                      - type: selector
                        name: "Fire Weapon"
                        children:
                          - type: sequence
                            name: "Melee Attack"
                            children:
                              - type: condition
                                check: "InMeleeRange"
                              - type: action
                                action: "MeleeAttack"
                          - type: sequence
                            name: "Shoot Enemy"
                            children:
                              - type: condition
                                check: "WeaponReady"
                              - type: condition
                                check: "IsAimedAtTarget"
                              - type: action
                                action: "FireWeapon"
                          - type: sequence
                            name: "Emergency Reload Under Fire"
                            children:
                              - type: condition
                                check: "AmmoLow"
                              - type: condition
                                check: "UnderHeavyFire"
                              - type: action
                                action: "SafeReload"

      # ===================================================================
      # PRIORITY 2: Investigation Behavior (medium priority)
      # When NO visible enemy BUT have recent enemy memory or heard sound
      # ===================================================================
      - type: selector
        name: "Investigation"
        description: "Search for enemies or investigate sounds"
        children:
          # Investigate enemy last known position
          - type: sequence
            name: "Investigate Enemy Memory"
            description: "Search area where enemy was last seen"
            children:
              # Check if we have high-confidence enemy memory
              - type: condition
                check: "HasHighConfidenceMemory"
              
              # Start investigation
              - type: action
                action: "StartInvestigation"
              
              # Move to last known position
              - type: action
                action: "MoveToInvestigationTarget"
              
              # Search area in detail
              - type: selector
                name: "Search Pattern"
                children:
                  # First try cardinal direction look-around
                  - type: sequence
                    name: "Quick Look Around"
                    children:
                      - type: condition
                        check: "IsAtInvestigationTarget"
                      - type: action
                        action: "SearchArea"
                  
                  # If not found, do full 720° spiral
                  - type: sequence
                    name: "Full Spiral Search"
                    children:
                      - type: condition
                        check: "InvestigationTimedOut"
                        invert: true
                      - type: action
                        action: "SearchArea"
              
              # Mark as checked
              - type: action
                action: "MarkInvestigationComplete"
          
          # Investigate interesting sound
          - type: sequence
            name: "Investigate Sound"
            description: "Check out suspicious noise"
            children:
              # Check if we heard important sound
              - type: condition
                check: "HasInterestingSound"
              
              # Start investigation
              - type: action
                action: "StartSoundInvestigation"
              
              # Move to sound origin
              - type: action
                action: "MoveToSoundOrigin"
              
              # Look around
              - type: selector
                name: "Sound Search"
                children:
                  # Quick look
                  - type: sequence
                    name: "Quick Sound Search"
                    children:
                      - type: condition
                        check: "IsAtSoundOrigin"
                      - type: action
                        action: "SearchSoundArea"
                  
                  # Full search
                  - type: sequence
                    name: "Full Sound Search"
                    children:
                      - type: condition
                        check: "SoundInvestigationTimedOut"
                        invert: true
                      - type: action
                        action: "SearchSoundArea"
              
              # Mark as investigated
              - type: action
                action: "MarkSoundInvestigated"

      # ===================================================================
      # PRIORITY 3: Patrol Behavior (lowest priority - default)
      # When NO combat and NO investigation needed
      # ===================================================================
      - type: sequence
        name: "Patrol"
        description: "Default behavior - patrol waypoints"
        children:
          # Just patrol
          - type: action
            action: "PatrolWaypoints"
