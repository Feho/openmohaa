# Idle Behavior Tree
# Added in OPM - Phase 3 Task 3.3
#
# Implements idle behaviors that keep bots active and believable when no threats exist:
# - Curious investigation of minor ambient sounds
# - Use of attractive tactical nodes (sniper, cover, corners)
# - Patrol routes with waypoints
# - Random wandering when no patrol exists
# - Idle standing with occasional look-around

tree:
  name: "Idle Behavior"
  description: "Handles idle behaviors when no threats exist"

  metadata:
    version: "1.0"
    author: "OpenMoHAA"
    phase: "3.3"

  root:
    type: selector
    name: "Idle Root"
    children:
      # Priority 1: Investigate curious sounds (minor ambient sounds)
      - type: sequence
        name: "Curious Investigation"
        children:
          # Check for curious sound (footsteps, doors, not weapon fire)
          - type: condition
            name: "Has Curious Sound"
            check: "HasCuriousSound"

          # Set target for curious investigation
          - type: action
            name: "Set Curious Target"
            action: "SetCuriousTarget"

          # Move to curious location
          - type: action
            name: "Move to Curious Location"
            action: "MoveToCuriousLocation"

          # Quick look around at curious location
          - type: sequence
            name: "Quick Look"
            children:
              - type: condition
                name: "Reached Curious Location"
                check: "ReachedCuriousLocation"
              - type: action
                name: "Quick Look Around"
                action: "QuickLookAround"
              - type: action
                name: "Clear Curious State"
                action: "ClearCuriousState"

      # Priority 2: Use attractive node if available
      - type: sequence
        name: "Use Attractive Node"
        children:
          # Check for nearby attractive node
          - type: condition
            name: "Has Nearby Attractive Node"
            check: "HasNearbyAttractiveNode"

          # Move to attractive node
          - type: action
            name: "Move to Attractive Node"
            action: "MoveToAttractiveNode"

          # Use the node (snipe, guard, etc.)
          - type: sequence
            name: "Use Node"
            children:
              - type: condition
                name: "Reached Attractive Node"
                check: "ReachedAttractiveNode"
              - type: action
                name: "Use Attractive Node"
                action: "UseAttractiveNode"

      # Priority 3: Follow patrol route
      - type: sequence
        name: "Patrol"
        children:
          # Check if patrol route exists
          - type: condition
            name: "Has Patrol Route"
            check: "HasPatrolRoute"

          # Move to next patrol waypoint
          - type: action
            name: "Move to Next Waypoint"
            action: "MoveToNextPatrolWaypoint"

          # Handle waypoint reached or continue
          - type: selector
            name: "Waypoint Actions"
            children:
              # Reached waypoint - pause and advance
              - type: sequence
                name: "Waypoint Reached"
                children:
                  - type: condition
                    name: "Reached Waypoint"
                    check: "ReachedPatrolWaypoint"
                  - type: action
                    name: "Pause at Waypoint"
                    action: "PauseAtWaypoint"
                  - type: action
                    name: "Advance to Next"
                    action: "AdvanceToNextWaypoint"

              # Still moving to waypoint
              - type: action
                name: "Continue Patrol"
                action: "ContinuePatrol"

      # Priority 4: Random wander
      - type: sequence
        name: "Wander"
        children:
          # Check if should wander
          - type: condition
            name: "Should Wander"
            check: "ShouldWander"

          # Pick random wander target
          - type: action
            name: "Pick Wander Target"
            action: "PickRandomWanderTarget"

          # Move to wander target
          - type: action
            name: "Move to Wander Target"
            action: "MoveToWanderTarget"

          # Handle wander reached
          - type: sequence
            name: "Wander Reached"
            children:
              - type: condition
                name: "Reached Wander Target"
                check: "ReachedWanderTarget"
              - type: action
                name: "Pause After Wander"
                action: "PauseAfterWander"
              - type: action
                name: "Clear Wander Target"
                action: "ClearWanderTarget"

      # Priority 5: Stand idle (fallback)
      - type: sequence
        name: "Stand Idle"
        children:
          - type: action
            name: "Stand in Place"
            action: "StandInPlace"
          - type: action
            name: "Occasional Look Around"
            action: "OccasionalLookAround"
