# combat.yaml
# Complete Combat Behavior Tree
# Added in OPM - Phase 3 Task 3.1f
# Uses actions from Tasks 3.1a (target), 3.1b (aim/fire), 3.1c (movement)

tree:
  name: "Combat Root"
  description: "Complete combat behavior: target selection, aiming, firing, movement"
  
  metadata:
    version: "1.0"
    author: "OpenMoHAA"
    phase: "3.1f"

  root:
    type: selector
    children:
    # Priority 1: Validate target exists
    - type: sequence
      name: "Ensure Target Selected"
      children:
        - type: condition
          check: "HasValidTarget"
          invert: true  # If NOT has valid target...
        - type: action
          action: "SelectTarget"  # ...then select one
    
    # Priority 2: Main combat engagement
    - type: sequence
      name: "Engage Enemy"
      children:
        # Must have valid, visible target
        - type: condition
          check: "HasValidTarget"
        - type: condition
          check: "TargetVisible"
        
        # Combat loop: move + aim + fire in parallel
        - type: parallel
          policy: "RequireAll"
          name: "Combat Actions"
          children:
            # Subtree: Distance management
            - type: selector
              name: "Manage Combat Distance"
              children:
                # Too close: back away
                - type: sequence
                  name: "Retreat From Close Enemy"
                  children:
                    - type: condition
                      check: "EnemyTooClose"
                    - type: action
                      action: "RetreatFromEnemy"
                
                # Too far: move closer
                - type: sequence
                  name: "Approach Distant Enemy"
                  children:
                    - type: condition
                      check: "EnemyTooFar"
                    - type: action
                      action: "ApproachEnemy"
                
                # In range: maintain with strafe
                - type: sequence
                  name: "Maintain Optimal Range"
                  children:
                    - type: condition
                      check: "InOptimalRange"
                    - type: action
                      action: "MaintainDistance"
            
            # Subtree: Aiming
            - type: action
              action: "AimAtTarget"
              name: "Aim At Enemy"
            
            # Subtree: Firing
            - type: selector
              name: "Fire Weapon"
              children:
                # Melee if very close or no ammo
                - type: sequence
                  name: "Melee Attack"
                  children:
                    - type: condition
                      check: "InMeleeRange"
                    - type: action
                      action: "MeleeAttack"
                
                # Normal fire if weapon ready
                - type: sequence
                  name: "Shoot Enemy"
                  children:
                    - type: condition
                      check: "WeaponReady"
                    - type: condition
                      check: "IsAimedAtTarget"
                    - type: action
                      action: "FireWeapon"
    
    # Priority 3: Fallback - lost enemy
    - type: action
      action: "Idle"
      name: "No Enemy Visible"
