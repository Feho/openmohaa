# combat.yaml
# Complete Combat Behavior Tree
# Added in OPM - Phase 3 Task 3.1f
# Enhanced in OPM - Phase 3 Task 3.1e (Tactical Combat & Retreat System)
# Enhanced in OPM - Phase 3 Task 3.1g (Grenade System)
# Uses actions from Tasks 3.1a (target), 3.1b (aim/fire), 3.1c (movement), 3.1e (tactical), 3.1g (grenades)

tree:
  name: "Combat Root"
  description: "Complete combat behavior: target selection, aiming, firing, movement, tactical retreat, grenade tactics"
  
  metadata:
    version: "1.2"
    author: "OpenMoHAA"
    phase: "3.1g"

  root:
    type: selector
    children:
    # Priority 0: Emergency Tactical Retreat (highest priority)
    - type: sequence
      name: "Emergency Tactical Retreat"
      children:
        - type: condition
          check: "ShouldRetreat"
        - type: selector
          name: "Find Safety"
          children:
            # Try to find cover
            - type: sequence
              name: "Retreat To Cover"
              children:
                - type: action
                  action: "FindCover"
                - type: action
                  action: "MoveToCover"
                - type: action
                  action: "TacticalRetreat"
            
            # Fallback: just retreat
            - type: action
              action: "TacticalRetreat"
        
        # While retreating, suppress fire if possible
        - type: sequence
          name: "Covering Fire While Retreating"
          children:
            - type: condition
              check: "HasValidTarget"
            - type: action
              action: "SuppressFire"
    
    # Priority 1: Weapon switching (empty weapon or better available)
    - type: sequence
      name: "Weapon Switch"
      children:
        - type: selector
          name: "Switch Reason"
          children:
            # Empty weapon - immediate switch
            - type: sequence
              name: "Switch Empty Weapon"
              children:
                - type: condition
                  check: "CurrentWeaponEmpty"
                - type: condition
                  check: "WeaponSwitchReady"
                - type: action
                  action: "SelectBestWeapon"
                - type: action
                  action: "SwitchWeapon"
            
            # Better weapon available - opportunistic switch
            - type: sequence
              name: "Switch To Better Weapon"
              children:
                - type: condition
                  check: "BetterWeaponAvailable"
                - type: condition
                  check: "WeaponSwitchReady"
                - type: action
                  action: "SelectBestWeapon"
                - type: action
                  action: "SwitchWeapon"
    
    # Priority 2: Safe Reload (when ammo low and safe)
    - type: sequence
      name: "Safe Reload Opportunity"
      children:
        - type: condition
          check: "AmmoLow"
        - type: condition
          check: "SafeToReload"
        - type: action
          action: "SafeReload"
    
    # Priority 3: Validate target exists
    - type: sequence
      name: "Ensure Target Selected"
      children:
        - type: condition
          check: "HasValidTarget"
          invert: true  # If NOT has valid target...
        - type: action
          action: "SelectTarget"  # ...then select one
    
    # Priority 4: Grenade Opportunity (clustered enemies)
    - type: sequence
      name: "Throw Grenade At Cluster"
      children:
        - type: condition
          check: "HasGrenades"
        - type: condition
          check: "ShouldThrowGrenade"
        - type: action
          action: "CalculateGrenadeTarget"
        - type: action
          action: "ThrowGrenade"
    
    # Priority 5: Suppression Fire (enemy not visible but known position)
    - type: sequence
      name: "Suppression Fire"
      children:
        - type: condition
          check: "HasValidTarget"
        - type: condition
          check: "TargetVisible"
          invert: true  # NOT visible
        - type: condition
          check: "UnderHeavyFire"
          invert: true  # NOT under fire (defensive only)
        - type: action
          action: "SuppressFire"
    
    # Priority 6: Main combat engagement
    - type: sequence
      name: "Engage Enemy"
      children:
        # Must have valid, visible target
        - type: condition
          check: "HasValidTarget"
        - type: condition
          check: "TargetVisible"
        
        # Combat loop: move + aim + fire in parallel
        - type: parallel
          policy: "RequireAll"
          name: "Combat Actions"
          children:
            # Subtree: Distance management
            - type: selector
              name: "Manage Combat Distance"
              children:
                # Too close: back away
                - type: sequence
                  name: "Retreat From Close Enemy"
                  children:
                    - type: condition
                      check: "EnemyTooClose"
                    - type: action
                      action: "RetreatFromEnemy"
                
                # Too far: move closer
                - type: sequence
                  name: "Approach Distant Enemy"
                  children:
                    - type: condition
                      check: "EnemyTooFar"
                    - type: action
                      action: "ApproachEnemy"
                
                # In range: maintain with strafe
                - type: sequence
                  name: "Maintain Optimal Range"
                  children:
                    - type: condition
                      check: "InOptimalRange"
                    - type: action
                      action: "MaintainDistance"
            
            # Subtree: Aiming
            - type: action
              action: "AimAtTarget"
              name: "Aim At Enemy"
            
            # Subtree: Firing
            - type: selector
              name: "Fire Weapon"
              children:
                # Melee if very close or no ammo
                - type: sequence
                  name: "Melee Attack"
                  children:
                    - type: condition
                      check: "InMeleeRange"
                    - type: action
                      action: "MeleeAttack"
                
                # Normal fire if weapon ready
                - type: sequence
                  name: "Shoot Enemy"
                  children:
                    - type: condition
                      check: "WeaponReady"
                    - type: condition
                      check: "IsAimedAtTarget"
                    - type: action
                      action: "FireWeapon"
                
                # Need reload but can't (under fire)
                - type: sequence
                  name: "Emergency Reload Under Fire"
                  children:
                    - type: condition
                      check: "AmmoLow"
                    - type: condition
                      check: "UnderHeavyFire"
                    - type: action
                      action: "SafeReload"
    
    # Priority 7: Fallback - lost enemy
    - type: action
      action: "Idle"
      name: "No Enemy Visible"
