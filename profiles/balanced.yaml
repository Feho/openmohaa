# balanced.yaml
# Balanced bot profile - well-rounded, no extreme behaviors
# Added in OPM - Phase 2B.3: Complete Profile System

profile:
  # === METADATA ===
  metadata:
    name: "Balanced Soldier"
    description: "Well-rounded, no extreme behaviors"
    difficulty: medium
    author: "OpenMoHAA Team"
    version: "1.0"

  # === PERSONALITY ===
  personality:
    aggression: 0.5
    caution: 0.5
    teamwork: 0.6
    creativity: 0.5

  # === COMBAT PARAMETERS ===
  combat:
    preferred_range: 512.0
    fire_discipline: 0.5
    burst_length: [0.3, 0.8]
    burst_delay: [0.2, 0.5]
    ammo_conservation: 0.5
    reload_under_fire: false
    # Added in OPM - Phase 3 Task 3.1a
    target_lock_time: 2.0          # Seconds to lock onto target
    target_switch_threshold: 128.0 # Distance advantage to switch targets
    # Added in OPM - Phase 3 Task 3.1h
    weapon_preferences:
      pistol: 0.3  # Low preference
      rifle: 0.8   # High preference
      smg: 0.6     # Moderate
      mg: 0.5      # Neutral

  # === MOVEMENT PARAMETERS ===
  movement:
    speed_preference: 1.0
    crouch_frequency: 0.4
    jump_frequency: 0.4
    strafe_usage: 0.5
    path_deviation: 0.3        # Added in OPM - Phase 3 Task 3.1c

  # === AIM PARAMETERS ===
  aim:
    reaction_time: [0.2, 0.5]
    tracking_smoothness: 0.7
    spread_multiplier: 1.0
    headshot_bias: 0.5
    aim_tolerance: 5.0           # Degrees - balanced precision

  # === TACTICAL PARAMETERS ===
  tactics:
    cover_usage: 0.5
    retreat_threshold: 0.25
    flank_preference: 0.5
    grenade_frequency: 0.4

  # === PERCEPTION ===
  perception:
    vision:
      fov: 80.0
      range: 2048.0
      peripheral_range: 0.6
    hearing:
      range: 1024.0
      priority_threshold: 0.5

  # === BEHAVIOR TREE REFERENCE ===
  # Added in OPM - Phase 3 Task 3.1f
  #  Updated to use complete combat behavior tree
  # Updated in OPM - Phase 3 Task 3.2
  #  Changed to main_bot tree which includes combat + investigation + patrol
  # Updated in OPM - Phase 3 Task 3.2 (Subtree Support)
  #  Changed to main_bot_v2 which uses subtree composition
  behavior_tree: "main_bot_v2"
