# sniper.yaml
# Sniper bot profile - long range, patient, accurate
# Added in OPM - Phase 2B.3: Complete Profile System

profile:
  # === METADATA ===
  metadata:
    name: "Sniper"
    description: "Long range, patient, accurate"
    difficulty: hard
    author: "OpenMoHAA Team"
    version: "1.0"

  # === PERSONALITY ===
  personality:
    aggression: 0.4
    caution: 0.8
    teamwork: 0.5
    creativity: 0.6

  # === COMBAT PARAMETERS ===
  combat:
    preferred_range: 1024.0
    fire_discipline: 0.9
    burst_length: [0.1, 0.3]
    burst_delay: [0.8, 1.5]
    ammo_conservation: 0.9
    reload_under_fire: false
    # Added in OPM - Phase 3 Task 3.1a
    target_lock_time: 4.0          # Long lock for focused shots
    target_switch_threshold: 200.0 # Committed to chosen target

  # === MOVEMENT PARAMETERS ===
  movement:
    speed_preference: 0.9
    crouch_frequency: 0.6
    jump_frequency: 0.2
    strafe_usage: 0.3
    path_deviation: 0.1        # Added in OPM - Phase 3 Task 3.1c

  # === AIM PARAMETERS ===
  aim:
    reaction_time: [0.2, 0.4]
    tracking_smoothness: 0.9
    spread_multiplier: 0.6
    headshot_bias: 0.9
    aim_tolerance: 1.5           # Degrees - very precise (sniper)

  # === TACTICAL PARAMETERS ===
  tactics:
    cover_usage: 0.8
    retreat_threshold: 0.3
    flank_preference: 0.4
    grenade_frequency: 0.2

  # === PERCEPTION ===
  perception:
    vision:
      fov: 60.0
      range: 3072.0
      peripheral_range: 0.5
    hearing:
      range: 1024.0
      priority_threshold: 0.6

  # === BEHAVIOR TREE REFERENCE ===
  behavior_tree: "engage_enemy"
